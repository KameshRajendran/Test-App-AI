apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-app
  namespace: default
  labels:
    app: react-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-app
                port:
                  number: 80
  tls:
    - hosts:
        - app.example.com
      secretName: react-app-tls
