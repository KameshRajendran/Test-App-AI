apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: production
  labels:
    app: react-app
    environment: production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: react-app
      environment: production
  template:
    metadata:
      labels:
        app: react-app
        environment: production
    spec:
      serviceAccountName: react-app
      securityContext:
        fsGroup: 1000
      
      containers:
        - name: react-app
          image: <+service.variables.docker_image>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_ENDPOINT
              value: https://api.example.com
            - name: LOG_LEVEL
              value: "WARN"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - react-app
                topologyKey: kubernetes.io/hostname
